[build-system]
requires = ["setuptools>=68,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-mea-span"
version = "0.6.0"
description = "End-to-end multi-electrode array (MEA) analysis for .spk files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "George (Zhuang) Han" },
]
keywords = ["MEA", "multi-electrode array", "electrophysiology", "spike", "burst", "neuroscience"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pingouin>=0.5.4",
    "statsmodels>=0.14",
]

[project.urls]
Homepage = "https://github.com/Molecularbiologyworld/py-mea-span"
Repository = "https://github.com/Molecularbiologyworld/py-mea-span"
Issues = "https://github.com/Molecularbiologyworld/py-mea-span/issues"

[project.optional-dependencies]
interactive = ["plotly>=5.18"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
docs = ["sphinx>=7.2", "nbsphinx>=0.9"]

[project.scripts]
mea-span = "py_mea_span.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["py_mea_span*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
